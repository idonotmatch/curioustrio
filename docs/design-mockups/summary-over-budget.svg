  <text x="42" y="560" fill="#F4F7F9" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700">What needs attention</text>
  <text x="42" y="592" fill="#E9EEF2" font-family="Helvetica, Arial, sans-serif" font-size="15">2 expenses pending review</text>
  <text x="42" y="614" fill="#7C8B97" font-family="Helvetica, Arial, sans-serif" font-size="13">Imported from Gmail in the last 24 hours</text>
  <text x="42" y="646" fill="#E9EEF2" font-family="Helvetica, Arial, sans-serif" font-size="15">Recent sync: 14 minutes ago</text>

  <text x="22" y="716" fill="#90A1AE" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.1">QUICK ACTIONS</text>
