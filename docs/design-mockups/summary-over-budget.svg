  <text x="42" y="168" fill="#FFFFFF" font-family="Helvetica, Arial, sans-serif" font-size="42" font-weight="700">$1,746</text>
  <text x="42" y="192" fill="#F0D7D2" font-family="Helvetica, Arial, sans-serif" font-size="16">$146 over pace · projected to finish above budget</text>

  <rect x="42" y="214" width="306" height="12" rx="6" fill="#472B2B"/>
  <rect x="42" y="214" width="282" height="12" rx="6" fill="#F19074"/>

  <text x="42" y="254" fill="#FFFFFF" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700">You’re spending faster than usual.</text>
  <text x="42" y="278" fill="#F2D9D3" font-family="Helvetica, Arial, sans-serif" font-size="15">Most of the difference is coming from groceries and a few one-off purchases.</text>

  <rect x="22" y="330" width="346" height="144" rx="22" fill="#171114" stroke="#352428"/>
  <text x="42" y="362" fill="#D7A699" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.1">FEATURED INSIGHT</text>
  <rect x="42" y="377" width="84" height="24" rx="12" fill="#5A2420"/>
  <text x="56" y="393" fill="#FFDCD6" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700">Needs attention</text>
  <text x="42" y="424" fill="#F8F1F0" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700">Recurring staples are pushing groceries up</text>
  <text x="42" y="448" fill="#D9C3BF" font-family="Helvetica, Arial, sans-serif" font-size="15">Bananas and yogurt are both above baseline, adding about $18 of extra spend.</text>

  <text x="22" y="512" fill="#90A1AE" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.1">ACTIVITY DIGEST</text>
