  <text x="356" y="486" fill="#111827" font-family="Arial, sans-serif" font-size="28" font-weight="700">Why this answer</text>
  <rect x="356" y="514" width="688" height="118" rx="24" fill="#FFFFFF" stroke="#D7E2F1"/>
  <text x="388" y="554" fill="#111827" font-family="Arial, sans-serif" font-size="24" font-weight="700">Month projection</text>
  <text x="388" y="586" fill="#475569" font-family="Arial, sans-serif" font-size="19">You were already trending under budget this month, so this purchase does not</text>
  <text x="388" y="610" fill="#475569" font-family="Arial, sans-serif" font-size="19">push the projection above zero.</text>

  <rect x="356" y="652" width="688" height="148" rx="24" fill="#FFFFFF" stroke="#D7E2F1"/>
  <text x="388" y="692" fill="#111827" font-family="Arial, sans-serif" font-size="24" font-weight="700">Recurring purchases still ahead</text>
  <text x="388" y="724" fill="#475569" font-family="Arial, sans-serif" font-size="19">Expected soon: diapers, dog food</text>
  <text x="388" y="754" fill="#475569" font-family="Arial, sans-serif" font-size="19">These are already reflected in the tighter risk-adjusted headroom.</text>

  <rect x="356" y="828" width="250" height="54" rx="27" fill="#E8EEF7" stroke="#D0DBEA" stroke-dasharray="6 6"/>
  <text x="414" y="862" fill="#35506B" font-family="Arial, sans-serif" font-size="21" font-weight="700">Watch this scenario</text>

  <rect x="1090" y="296" width="230" height="504" rx="28" fill="#F8FAFC" stroke="#D7E2F1"/>
  <text x="1122" y="336" fill="#111827" font-family="Arial, sans-serif" font-size="22" font-weight="700">Other states</text>
  <text x="1122" y="384" fill="#166534" font-family="Arial, sans-serif" font-size="18" font-weight="700">Comfortable</text>
  <text x="1122" y="414" fill="#334155" font-family="Arial, sans-serif" font-size="17">Room remains even after recurring pressure.</text>
