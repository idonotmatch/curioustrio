  <text x="384" y="384" fill="#0F172A" font-family="Arial, sans-serif" font-size="34" font-weight="700">$242</text>

  <rect x="590" y="296" width="220" height="126" rx="24" fill="#FFFFFF" stroke="#D7E2F1"/>
  <text x="618" y="334" fill="#64748B" font-family="Arial, sans-serif" font-size="16" font-weight="700">AFTER PURCHASE</text>
  <text x="618" y="384" fill="#0F172A" font-family="Arial, sans-serif" font-size="34" font-weight="700">$62</text>

  <rect x="824" y="296" width="220" height="126" rx="24" fill="#FFFFFF" stroke="#D7E2F1"/>
