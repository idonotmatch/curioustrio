<svg width="1400" height="980" viewBox="0 0 1400 980" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1400" height="980" fill="#F4F7FB"/>
  <rect x="300" y="36" width="800" height="908" rx="36" fill="#FBFDFF" stroke="#C9D6E8" stroke-width="2"/>
  <text x="356" y="96" fill="#1F2937" font-family="Arial, sans-serif" font-size="28" font-weight="700">Scenario result</text>
  <rect x="356" y="130" width="150" height="36" rx="18" fill="#E6F7ED"/>
  <text x="391" y="154" fill="#166534" font-family="Arial, sans-serif" font-size="18" font-weight="700">Comfortable</text>
  <text x="356" y="212" fill="#0F172A" font-family="Arial, sans-serif" font-size="36" font-weight="700">Yes, this looks comfortably absorbable.</text>
  <text x="356" y="252" fill="#475569" font-family="Arial, sans-serif" font-size="22">A $180 running-shoes purchase still leaves room after expected recurring spend.</text>

  <rect x="356" y="296" width="220" height="126" rx="24" fill="#FFFFFF" stroke="#D7E2F1"/>
