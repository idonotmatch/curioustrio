  <text x="1122" y="498" fill="#334155" font-family="Arial, sans-serif" font-size="17">Fits, but uses a meaningful share of room.</text>
  <text x="1122" y="552" fill="#B45309" font-family="Arial, sans-serif" font-size="18" font-weight="700">Tight</text>
  <text x="1122" y="582" fill="#334155" font-family="Arial, sans-serif" font-size="17">Technically possible, but month gets narrow.</text>
  <text x="1122" y="636" fill="#B91C1C" font-family="Arial, sans-serif" font-size="18" font-weight="700">Risky / Not absorbable</text>
  <text x="1122" y="666" fill="#334155" font-family="Arial, sans-serif" font-size="17">Projected over-budget after this purchase.</text>
  <text x="1122" y="720" fill="#475569" font-family="Arial, sans-serif" font-size="18" font-weight="700">Unknown</text>
  <text x="1122" y="750" fill="#334155" font-family="Arial, sans-serif" font-size="17">Not enough history to answer confidently yet.</text>
