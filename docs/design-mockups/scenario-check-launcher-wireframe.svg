  <text x="420" y="582" fill="#111827" font-family="Arial, sans-serif" font-size="24" font-weight="700">Projected under budget</text>
  <text x="420" y="614" fill="#64748B" font-family="Arial, sans-serif" font-size="19">You're still trending under your usual household</text>
