  <text x="420" y="288" fill="#0F172A" font-family="Arial, sans-serif" font-size="28" font-weight="700">Can I afford something?</text>
  <text x="420" y="326" fill="#475569" font-family="Arial, sans-serif" font-size="20">Pressure-test a purchase against this month's</text>
  <text x="420" y="352" fill="#475569" font-family="Arial, sans-serif" font-size="20">projected headroom and recurring pressure.</text>
  <rect x="420" y="372" width="156" height="34" rx="17" fill="#E6F7ED"/>
  <text x="440" y="395" fill="#166534" font-family="Arial, sans-serif" font-size="18" font-weight="700">Planning tool</text>
