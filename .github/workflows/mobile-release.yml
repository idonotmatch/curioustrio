name: Mobile Release Checks

on:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-release.yml'
  push:
    branches:
      - main
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-release.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        run: npm ci

      - name: Run mobile regression checks
        run: npm test

      - name: Verify iOS production export
        run: npx expo export --platform ios --output-dir "$RUNNER_TEMP/adlo-ios-export"
